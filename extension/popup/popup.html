<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ActiveAid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="app">
      <div class="banner banner--error" id="errorBanner" hidden>
        <span id="errorText"></span>
      </div>

      <header class="header">
        <img
          class="logo"
          src="../assets/icon-48.png"
          width="40"
          height="40"
          alt=""
        />
        <div class="headerText">
          <h1 class="title">ActiveAid</h1>
          <p class="subtitle">Wellness while you work.</p>
        </div>
      </header>

      <section class="statusCard" id="statusCard">
        <span class="badge" id="statusBadge">Reminders on</span>
        <p class="statusMessage" id="statusMessage">Checking in…</p>
        <p class="statusMeta" id="statusMeta"></p>
      </section>

      <section class="card">
        <h2 class="sectionTitle">Reminders</h2>

        <label class="toggle">
          <input type="checkbox" id="notificationsEnabled" />
          <span class="toggleTrack" aria-hidden="true"></span>
          <span class="toggleLabel">Enable gentle reminders</span>
        </label>

        <div class="field">
          <label class="fieldLabel" for="reminderIntervalMinutes">
            Remind me after (minutes)
          </label>
          <div class="presets" role="group" aria-label="Quick intervals">
            <button class="preset" type="button" data-minutes="30">30</button>
            <button class="preset" type="button" data-minutes="60">60</button>
            <button class="preset" type="button" data-minutes="90">90</button>
          </div>
          <input
            type="number"
            id="reminderIntervalMinutes"
            min="1"
            max="240"
            step="1"
          />
        </div>

        <div class="actions">
          <button class="btn btn--secondary" id="snooze10" type="button">
            Snooze 10m
          </button>
          <button class="btn btn--secondary" id="snooze30" type="button">
            Snooze 30m
          </button>
          <button class="btn btn--ghost" id="resetTimer" type="button">
            Reset timer
          </button>
        </div>
      </section>

      <footer class="footer">
        <p>We only track activity timing — never what you type.</p>
      </footer>
    </div>

    <script type="module" src="./popup.js"></script>
  </body>
</html>
